# Statyczna strona — bez kroku budowania, publikujemy katalog główny repozytorium.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache zostawiamy domyślnym ustawieniom Netlify (max-age=0 + ETag): CDN i tak serwuje pliki
# szybko, a podmienione zdjęcia i nowa wersja strony są widoczne od razu po wdrożeniu.

