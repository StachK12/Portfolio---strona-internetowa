<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nie ma takiej strony — Stanisław Knul</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0a09">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230c0a09'/%3E%3Cpath d='M14 25V14h11M39 14h11v11M50 39v11H39M25 50H14V39' fill='none' stroke='%23f4efe6' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23d4489f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--void:#0c0a09;--paper:#f4efe6;--paper-dim:#b6b0a2;--muted:#7d766a;--magenta:#d4489f}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--void);color:var(--paper);font:300 16px/1.6 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;text-align:center}
.frame{position:relative;padding:56px 40px;max-width:560px;width:100%}
.frame i{position:absolute;width:28px;height:28px;border:2px solid var(--paper)}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(72px,18vw,140px);line-height:1;margin:16px 0 8px}
h1 span{color:var(--magenta)}
p{color:var(--paper-dim);margin-bottom:28px}
a{display:inline-block;color:var(--paper);text-decoration:none;border:1px solid rgba(244,239,230,.3);padding:12px 26px;transition:border-color .2s,color .2s}
a:hover,a:focus-visible{border-color:var(--magenta);color:var(--magenta)}
</style>
</head>
<body>
<div class="frame"><i></i><i></i><i></i><i></i>
  <div class="mono">Brak ostrości · 404</div>
  <h1>4<span>0</span>4</h1>
  <p>Ten kadr nie istnieje — strona mogła zostać przeniesiona albo adres jest błędny.</p>
  <a href="/">← Wróć na stronę główną</a>
</div>
</body>
</html>
